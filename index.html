         ───────────────────────────────────────── */
      function injectAdminGoldPanel() {
        if (document.getElementById('bgs-admin-gold-panel')) return true;

        // Find the existing React 22K rate label
        var labels = document.querySelectorAll('label');
        var target22K = null;
        for (var i = 0; i < labels.length; i++) {
          var txt = labels[i].textContent;
          if (txt.includes('22K') && (txt.includes('AED') || txt.includes('per gram') || txt.includes('Rate'))) {
            target22K = labels[i];
            break;
          }
        }
        if (!target22K) return false;

        // Walk up until we reach the element that contains the "22K Gold Rate" heading
        var section = target22K.parentElement;
        var found = false;
        for (var j = 0; j < 10; j++) {
          if (!section || section.id === 'root' || section.tagName === 'MAIN') break;
          var headings = section.querySelectorAll('h1,h2,h3,h4');
          for (var hi = 0; hi < headings.length; hi++) {
            if (headings[hi].textContent.includes('22K Gold Rate')) { found = true; break; }
          }
          if (found) break;
          section = section.parentElement;
        }
        if (!found || !section) return false;
        if (section.dataset.bgsAdminDone) return true;
        section.dataset.bgsAdminDone = '1';

        // Hide the original React 22K section entirely
        section.style.cssText += ';display:none!important;';

        // Build unified panel for all 5 karats
        var panel = document.createElement('div');
        panel.id = 'bgs-admin-gold-panel';

        var titleEl = document.createElement('p');
        titleEl.className = 'bgs-ag-title';
        titleEl.textContent = 'Gold Rate Overrides — AED/g';
        panel.appendChild(titleEl);

        var subtitleEl = document.createElement('p');
        subtitleEl.style.cssText = 'font-size:0.6rem;color:rgba(255,255,255,0.28);margin:0 0 1rem;letter-spacing:0.04em;line-height:1.5;';
        subtitleEl.textContent = 'Leave blank to use live prices from dubaicityofgold.com. Save to override manually.';
        panel.appendChild(subtitleEl);

        var ALL_KARATS = ['24K', '22K', '21K', '18K', '14K'];
        ALL_KARATS.forEach(function (k) {
          var stored = localStorage.getItem(GOLD_KEYS[k]) || '';
          var live = liveRates[k] ? liveRates[k].toFixed(2) : '';
          var placeholder = live ? 'Live: ' + live : 'Auto';
          var row = document.createElement('div');
          row.className = 'bgs-ag-row';
          row.innerHTML =
            '<label class="bgs-ag-label">' + k + '</label>' +
            '<input id="bgs-ag-input-' + k + '" class="bgs-ag-input" type="number" step="0.01" min="0"' +
              ' placeholder="' + placeholder + '" value="' + stored + '" />' +
            '<button class="bgs-ag-save" onclick="bgsAdminSaveRate(\'' + k + '\')">Save</button>' +
            '<button class="bgs-ag-clear" onclick="bgsAdminClearRate(\'' + k + '\')">Clear</button>' +
            '<span id="bgs-ag-tick-' + k + '" class="bgs-ag-tick">&#10003;</span>';
          panel.appendChild(row);
        });

        section.parentElement.insertBefore(panel, section.nextSibling);
        return true;
      }

      window.bgsAdminSaveRate = function (karat) {
        var input = document.getElementById('bgs-ag-input-' + karat);
        if (!input) return;
        /* 0 or a blank field means "no manual override" — drop the key so the
           karat follows dubaicityofgold.com again. */
        var raw = String(input.value).trim();
        var val = parseFloat(raw);
        if (raw === '' || val === 0) {
          window.bgsAdminClearRate(karat);
          return;
        }
        if (isNaN(val) || val < 0) {
          alert('Enter a price, or 0 to follow the live rate.');
          return;
        }
        localStorage.setItem(GOLD_KEYS[karat], String(val));
        window.dispatchEvent(new Event('bgs_gold_updated'));
        var tick = document.getElementById('bgs-ag-tick-' + karat);
        if (tick) {
          tick.style.display = 'block';
          setTimeout(function () { tick.style.display = 'none'; }, 2200);
        }
      };

      window.bgsAdminClearRate = function (karat) {
        localStorage.removeItem(GOLD_KEYS[karat]);
        var input = document.getElementById('bgs-ag-input-' + karat);
        if (input) input.value = '';
        window.dispatchEvent(new Event('bgs_gold_updated'));
        var tick = document.getElementById('bgs-ag-tick-' + karat);
        if (tick) {
          tick.textContent = '—';
          tick.style.display = 'block';
          setTimeout(function () {
            tick.style.display = 'none';
            tick.textContent = '✓';
          }, 1600);
        }
      };

      /* ─────────────────────────────────────────
         HERO PRODUCTS — THE COLLECTION
         ───────────────────────────────────────── */
      /* The nine pieces the hero collage ships with. Real product photography
         rather than the stock placeholders this used to hold — and the same
         pool the admin picks from, so the hero and The Collection stay in step.
         Nine is the layout's capacity; BGS_HERO_MAX enforces it. */
      var BGS_HERO_MAX = 9;
      var BGS_SHOWCASE = [
        {id:'ring-solitaire',   img:'/assets/hero/collection/ring-solitaire.webp?v=1',   tag:'Solitaire Ring',  name:'Diamond Solitaire Ring', metal:'White Gold',     stone:'Brilliant-Cut Diamond'},
        {id:'necklace-22k',     img:'/assets/hero/collection/necklace-22k.webp?v=1',     tag:'22K Necklace',    name:'22K Gold Necklace',      metal:'22K Yellow Gold', stone:''},
        {id:'earrings-22k',     img:'/assets/hero/collection/earrings-22k.webp?v=1',     tag:'22K Earrings',    name:'22K Gold Earrings',      metal:'22K Yellow Gold', stone:''},
        {id:'bangle-22k',       img:'/assets/hero/collection/bangle-22k.webp?v=1',       tag:'22K Bangle',      name:'22K Gold Bangle',        metal:'22K Yellow Gold', stone:''},
        {id:'chain-22k',        img:'/assets/hero/collection/chain-22k.webp?v=1',        tag:'22K Chain',       name:'22K Gold Chain',         metal:'22K Yellow Gold', stone:''},
        {id:'bracelet-22k',     img:'/assets/hero/collection/bracelet-22k.webp?v=1',     tag:'22K Bracelet',    name:'22K Gold Bracelet',      metal:'22K Yellow Gold', stone:''},
        {id:'necklace-classic', img:'/assets/hero/collection/necklace-classic.webp?v=1', tag:'Gold Necklace',   name:'Gold Necklace',          metal:'Yellow Gold',     stone:''},
        {id:'bracelet-classic', img:'/assets/hero/collection/bracelet-classic.webp?v=1', tag:'Gold Bracelet',   name:'Gold Bracelet',          metal:'Yellow Gold',     stone:''},
        {id:'earrings-hoops',   img:'/assets/hero/collection/earrings-hoops.webp?v=1',   tag:'Hoop Earrings',   name:'Gold Hoop Earrings',     metal:'Yellow Gold',     stone:''}
      ];

      /* ─────────────────────────────────────────
         EDITORIAL HERO
         Replaces the box artwork with the nine-object collage. The tiles come
         from the same admin selection that drives The Collection, so editing
         one edits both — which is what "the hero editor" is expected to mean.
         ───────────────────────────────────────── */
      function bgsHeroTiles() {
        var sel = getHeroSelection();
        var list = sel.length ? sel : BGS_SHOWCASE;
        return list.slice(0, BGS_HERO_MAX);
      }

      /* Which tiles wear a vertical caption, matching the drawn layout: the
         outer columns read down their outside edge, the rest read underneath. */
      var BGS_TILE_CAPS = ['v', 'v', 'v', 'h', 'v', 'vr', 'h', 'h', 'h'];

      function bgsRenderEditorialTiles() {
        var wrap = document.getElementById('bgs-editorial');
        if (!wrap) return;
        var grid = wrap.querySelector('.bge-grid-wrap');
        if (!grid) return;

        var tiles = bgsHeroTiles();
        var sig = tiles.map(function (t) { return t.id + '|' + t.name + '|' + t.img; }).join('~');
        if (grid.getAttribute('data-sig') === sig) return;   // nothing changed
        grid.setAttribute('data-sig', sig);

        grid.innerHTML = tiles.map(function (t, i) {
          var n = i + 1;
          var kind = BGS_TILE_CAPS[i] || 'h';
          var capCls = kind === 'h' ? 'bge-cap bge-cap-h'
                     : kind === 'vr' ? 'bge-cap bge-cap-v bge-cap-right'
                     : 'bge-cap bge-cap-v';
          var label = t.tag || t.name || '';
          return '<figure class="bge-tile bge-t' + n + '">' +
                   '<span class="' + capCls + '">' +
                     '<span class="bge-num">' + (n < 10 ? '0' + n : n) + '</span>' +
                     '<span class="bge-label">' + escHtml(label) + '</span>' +
                   '</span>' +
                   '<span class="bge-frame">' +
                     /* No lazy loading: all nine sit above the fold, so
                        deferring them only delays the hero. */
                     /* eager, explicitly: all nine are above the fold, and the
                        global perf pass below would otherwise lazy-load them. */
                     '<img src="' + escHtml(t.img) + '" alt="' + escHtml(t.name || label) +
                       '" decoding="async" loading="eager" fetchpriority="high">' +
                   '</span>' +
                 '</figure>';
        }).join('');
      }

      function bgsBuildEditorialHero() {
        var sec = document.getElementById('collection');
        if (!sec) return false;

        if (document.getElementById('bgs-editorial')) { bgsRenderEditorialTiles(); return true; }

        /* Everything React renders in this section — the "Curated exclusively"
           header, the product-card grid and its Browse More — is replaced. The
           collage carries its own headline, so keeping the old one would say the
           same thing twice. The <section> itself stays: #collection is the
           anchor the nav and the CTA scroll to. */
        sec.innerHTML = '';
        sec.style.setProperty('padding', '0', 'important');

        var wrap = document.createElement('div');
        wrap.id = 'bgs-editorial';
        wrap.innerHTML =
          '<div class="bge-stage">' +
            '<span class="bge-eyebrow">Nine Objects &middot; One Story</span>' +
            '<div class="bge-grid-wrap"></div>' +
            '<h1 class="bge-headline"><span>Layers hold</span><span>tales of gold</span></h1>' +
            '<button class="bge-cta" type="button">' +
              '<span>Contact Us</span><span class="bge-arrow">&rarr;</span>' +
            '</button>' +
          '</div>';
        sec.appendChild(wrap);

        wrap.querySelector('.bge-cta').addEventListener('click', function () {
          var f = document.getElementById('footer');
          if (f) f.scrollIntoView({ behavior: 'smooth' });
        });

        bgsRenderEditorialTiles();
        var reveal = function () { wrap.classList.add('bge-in'); };
        requestAnimationFrame(function () { requestAnimationFrame(reveal); });
        setTimeout(reveal, 400);
        return true;
      }

      window.addEventListener('bgs_hero_updated', bgsRenderEditorialTiles);

      function getHeroPool() {
        var pool = BGS_SHOWCASE.slice();
        try {
          var inv = JSON.parse(localStorage.getItem('fg_inventory') || '[]');
          inv.forEach(function(item) {
            if (item.img && item.name) {
              pool.push({
                id: 'inv-' + item.id,
                img: item.img,
                name: item.name,
                tag: item.category || 'Item',
                metal: item.karat ? item.karat + 'K Gold' : '',
                stone: item.desc || ''
              });
            }
          });
        } catch(e) {}
        return pool;
      }

      function getHeroSelection() {
        try { return JSON.parse(localStorage.getItem('fg_hero_products') || '[]'); }
        catch(e) { return []; }
      }

      function saveHeroSelection(arr) {
        if (arr.length === 0) {
          localStorage.removeItem('fg_hero_products');
        } else {
          localStorage.setItem('fg_hero_products', JSON.stringify(arr));
        }
        window.dispatchEvent(new Event('bgs_hero_updated'));
      }

      function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      function renderHeroPanel() {
        var panel = document.getElementById('bgs-hero-panel');
        if (!panel) return;
        var selected = getHeroSelection();
        var selIds = selected.map(function(p){ return p.id; });
        var pool = getHeroPool();
        var available = pool.filter(function(p){ return selIds.indexOf(p.id) === -1; });

        var selHtml = selected.length === 0
          ? '<p style="color:#444;font-size:0.7rem;padding:0.6rem 0 1rem;">None selected — collection shows defaults.</p>'
          : selected.map(function(p, i) {
              var upBtn   = i > 0 ? '<button class="bgs-hp-move" onclick="bgsHeroMove(\'' + escHtml(p.id) + '\',-1)">↑</button>' : '<span style="width:24px;display:inline-block"></span>';
              var downBtn = i < selected.length-1 ? '<button class="bgs-hp-move" onclick="bgsHeroMove(\'' + escHtml(p.id) + '\',1)">↓</button>' : '<span style="width:24px;display:inline-block"></span>';
              return '<div class="bgs-hp-selected-row">' +
                '<span class="bgs-hp-sel-num">' + (i+1) + '</span>' +
                '<img class="bgs-hp-sel-img" src="' + escHtml(p.img) + '" alt="">' +
                '<input class="bgs-hp-sel-name bgs-hp-rename" type="text" value="' + escHtml(p.name) + '"' +
                  ' data-id="' + escHtml(p.id) + '" title="Rename — shown under this tile in the hero"' +
                  ' onchange="bgsHeroRename(this.dataset.id, this.value)"' +
                  ' onkeydown="if(event.key===\'Enter\'){this.blur();}">' +
                '<div class="bgs-hp-sel-btns">' + upBtn + downBtn +
                  '<button class="bgs-hp-remove" onclick="bgsHeroRemove(\'' + escHtml(p.id) + '\')">✕</button>' +
                '</div>' +
              '</div>';
            }).join('');

        /* Say the hero is full before a click can fail, rather than only in the
           alert afterwards. */
        var full = selected.length >= BGS_HERO_MAX;
        var availHtml = full
          ? '<p style="color:#e0a33c;font-size:0.72rem;line-height:1.6;">' +
              'The hero is full at ' + BGS_HERO_MAX + ' pieces. Remove one above to free a place.</p>'
          : available.length === 0
          ? '<p style="color:#444;font-size:0.7rem;">All products added.</p>'
          : available.map(function(p) {
              return '<div class="bgs-hp-card" onclick="bgsHeroAdd(\'' + escHtml(p.id) + '\')">' +
                '<div class="bgs-hp-card-img-wrap"><img src="' + escHtml(p.img) + '" alt="" loading="lazy"><div class="bgs-hp-card-add">＋</div></div>' +
                '<div class="bgs-hp-card-info"><p class="bgs-hp-card-name">' + escHtml(p.name) + '</p><p class="bgs-hp-card-tag">' + escHtml(p.tag) + '</p></div>' +
              '</div>';
            }).join('');

        panel.innerHTML =
          '<p class="bgs-hp-title">Hero Products — The Collection</p>' +
          '<p class="bgs-hp-sub">The nine pieces in the homepage hero, in order. Position 1 is the large tile top-left. ' +
            'Reorder with ↑↓, and click a name to rename it — the name is what shows under its tile. ' +
            'Leave empty to show the defaults.</p>' +
          '<p class="bgs-hp-section-label">Currently featured (' + selected.length + ' of ' + BGS_HERO_MAX + ')</p>' +
          selHtml +
          (selected.length > 0 ? '<button id="bgs-hp-reset" onclick="bgsHeroClear()">Reset to defaults</button><br><br>' : '') +
          '<p class="bgs-hp-section-label" style="margin-top:' + (selected.length ? '1.5rem' : '0') + '">Add to collection</p>' +
          '<div class="bgs-hp-grid">' + availHtml + '</div>';
      }

      function injectAdminHeroPanel() {
        if (document.getElementById('bgs-hero-panel')) { renderHeroPanel(); return true; }
        var goldPanel = document.getElementById('bgs-admin-gold-panel');
        if (!goldPanel) return false;
        var panel = document.createElement('div');
        panel.id = 'bgs-hero-panel';
        goldPanel.parentElement.insertBefore(panel, goldPanel.nextSibling);
        renderHeroPanel();
        return true;
      }

      window.bgsHeroAdd = function(id) {
        var pool = getHeroPool();
        var item = null;
        for (var i = 0; i < pool.length; i++) { if (pool[i].id === id) { item = pool[i]; break; } }
        if (!item) return;
        var sel = getHeroSelection();
        if (sel.some(function(p){ return p.id === id; })) return;
        /* The collage has nine placements and no tenth — say so plainly rather
           than accepting a piece that would never appear. */
        if (sel.length >= BGS_HERO_MAX) {
          alert('The hero section holds ' + BGS_HERO_MAX + ' pieces.\n\n' +
                'Remove one from "Currently featured" before adding ' +
                (item.name || 'another piece') + '.');
          return;
        }
        sel.push(item);
        saveHeroSelection(sel);
        renderHeroPanel();
      };

      window.bgsHeroRemove = function(id) {
        saveHeroSelection(getHeroSelection().filter(function(p){ return p.id !== id; }));
        renderHeroPanel();
      };

      window.bgsHeroMove = function(id, dir) {
        var sel = getHeroSelection();
        var idx = -1;
        for (var i = 0; i < sel.length; i++) { if (sel[i].id === id) { idx = i; break; } }
        if (idx < 0) return;
        var ni = idx + dir;
        if (ni < 0 || ni >= sel.length) return;
        var tmp = sel[idx]; sel[idx] = sel[ni]; sel[ni] = tmp;
        saveHeroSelection(sel);
        renderHeroPanel();
      };

      window.bgsHeroClear = function() {
        saveHeroSelection([]);
        renderHeroPanel();
      };

      /* Rename a featured piece. The caption under its tile is the tag, so both
         it and the display name move together — otherwise the hero would keep
         showing the old wording after a rename. Editing the selection only, so
         the underlying product keeps its own name elsewhere. */
      window.bgsHeroRename = function(id, value) {
        var name = String(value == null ? '' : value).trim();
        if (!name) { renderHeroPanel(); return; }
        var sel = getHeroSelection();
        var hit = false;
        for (var i = 0; i < sel.length; i++) {
          if (sel[i].id === id) {
            if (sel[i].name === name) return;   // nothing to do; don't churn sync
            sel[i].name = name;
            sel[i].tag  = name;
            hit = true;
            break;
          }
        }
        if (!hit) return;
        saveHeroSelection(sel);
        renderHeroPanel();
      };

      function makeHeroCard(p) {
        var sub = p.metal ? (p.metal + (p.stone ? ' · ' + p.stone : '')) : (p.stone || '');
        return '<div class="product-card card-enter" style="cursor:pointer" onclick="bgsOpenHeroModal(\'' + escHtml(p.id) + '\')">' +
          '<div class="relative w-full overflow-hidden" style="padding-top:100%">' +
            '<img src="' + escHtml(p.img) + '" alt="' + escHtml(p.name) + '" loading="lazy" class="card-img absolute inset-0 w-full h-full object-cover">' +
            '<div class="card-overlay absolute inset-0 flex flex-col justify-end" style="padding:1.4rem 1.2rem 1.2rem;background:linear-gradient(to top,rgba(10,10,10,0.97) 0%,rgba(10,10,10,0.75) 35%,rgba(10,10,10,0.15) 65%,transparent 100%)">' +
              '<p class="card-tag text-[0.58rem] tracking-[0.32em] uppercase mb-1" style="color:#d4af37">' + escHtml(p.tag||p.category||'') + '</p>' +
              '<h3 class="card-name font-playfair font-medium mb-1 leading-snug" style="font-size:1.05rem;color:#fff;letter-spacing:0.03em">' + escHtml(p.name) + '</h3>' +
              '<p class="card-desc text-[0.72rem] tracking-[0.08em] mb-3" style="color:#b3b3b3">' + escHtml(sub) + '</p>' +
            '</div>' +
          '</div>' +
        '</div>';

      var heroPrevSig = null;
      function applyHeroProducts() {
        var heroData = localStorage.getItem('fg_hero_products');
        var collSec = document.getElementById('collection');
        if (!collSec) return;
        var grid = collSec.querySelector('.grid.gap-5');
        if (!grid) return;

        if (!heroData || heroData === '[]') {
          // Clear any previous override if defaulting back
          if (heroPrevSig) { heroPrevSig = null; grid.removeAttribute('data-bgs-hero'); }
          return;
        }

        if (heroData === heroPrevSig && grid.getAttribute('data-bgs-hero') === '1') return;

        var heroes = [];
        try { heroes = JSON.parse(heroData); } catch(e) { return; }
        if (!heroes.length) return;

        grid.innerHTML = heroes.map(makeHeroCard).join('');
        grid.setAttribute('data-bgs-hero', '1');
        heroPrevSig = heroData;
      }

      window.addEventListener('bgs_hero_updated', function() { heroPrevSig = null; applyHeroProducts(); });

      /* ─────────────────────────────────────────
         IMPORT PREVIEW — IMAGE STATUS REPORT
         Tells the admin how many parsed rows have a
         usable image BEFORE they apply the upload.
         ───────────────────────────────────────── */
      var _imgReportSig = '';
      var _imgProbes = {}; // url -> 'pending' | 'ok' | 'fail'
      function probeImg(url) {
        if (_imgProbes[url]) return;
        _imgProbes[url] = 'pending';
        var im = new Image();
        im.onload = function () { _imgProbes[url] = 'ok'; };
        im.onerror = function () { _imgProbes[url] = 'fail'; };
        im.src = url;
      }

      function updateImportImageReport() {
        var applyBtn = null;
        var btns = document.querySelectorAll('button');
        for (var i = 0; i < btns.length; i++) {
          if (/^apply \d+ item/i.test(btns[i].textContent.trim())) { applyBtn = btns[i]; break; }
        }
        var existing = document.getElementById('bgs-img-report');
        if (!applyBtn || !window.bgsLastParsed) {
          if (existing) { existing.remove(); _imgReportSig = ''; }
          return;
        }

        var scope = applyBtn.parentElement, table = null;
        for (var j = 0; j < 6 && scope; j++) {
          table = scope.querySelector('table');
          if (table) break;
          scope = scope.parentElement;
        }
        if (!table) return;

        var items = window.bgsLastParsed;
        var total = items.length, empty = 0, broken = 0, pending = 0, ok = 0, driveFail = 0;
        for (var k = 0; k < total; k++) {
          var url = items[k] && items[k].img;
          if (!url) { empty++; continue; }
          var probeUrl = url.indexOf('|||') >= 0 ? url.split('|||')[0].trim() : url;
          if (!probeUrl) { empty++; continue; }
          probeImg(probeUrl);
          if (_imgProbes[probeUrl] === 'ok') ok++;
          else if (_imgProbes[probeUrl] === 'fail') {
            broken++;
            if (/drive\.google\.com/i.test(probeUrl)) driveFail++;
          }
          else pending++;
        }
        if (!total) return;

        var html;
        if (ok === total) {
          html = '<span style="color:#4ade80">&#10003; All ' + total + ' row image' + (total !== 1 ? 's' : '') + ' loaded successfully.</span>';
        } else {
          var parts = [];
          if (ok) parts.push(ok + ' loaded');
          if (empty) parts.push(empty + ' empty image cell' + (empty !== 1 ? 's' : ''));
          if (broken) parts.push(broken + ' link' + (broken !== 1 ? 's' : '') + ' failed to load');
          if (pending) parts.push(pending + ' still loading&hellip;');
          html =
            '<span style="color:' + (empty + broken > 0 ? '#fbbf24' : '#4ade80') + '">' +
              (empty + broken > 0 ? '&#9888; ' : '') + 'Images: ' + parts.join(' &middot; ') + ' (of ' + total + ' rows)' +
            '</span>' +
            (window.bgsXlsPictureWarning && empty > 0
              ? '<br><span style="color:#fbbf24">This sheet is in the old .xls format &mdash; pictures inside it cannot be read. ' +
                'In Excel choose File &rarr; Save As &rarr; &ldquo;Excel Workbook (.xlsx)&rdquo; and upload that file instead.</span>'
              : '') +
            (driveFail > 0
              ? '<br><span style="color:#fbbf24">' + driveFail + ' Google Drive link' + (driveFail !== 1 ? 's' : '') +
                ' failed — in Drive, right-click the image file &rarr; Share &rarr; set &ldquo;Anyone with the link&rdquo;, then re-upload this sheet.</span>'
              : '') +
            (empty + broken > 0
              ? '<br><span style="color:#666">Image cells must contain a public image link as text (https://&hellip;), ' +
                'or paste the picture directly onto the row in Excel (.xlsx) &mdash; both are supported. ' +
                'Placeholder links like example.com cannot be displayed.</span>'
              : '');
        }

        var sig = total + '|' + empty + '|' + broken + '|' + pending + '|' + ok + '|' + driveFail + '|' + (window.bgsXlsPictureWarning ? 1 : 0);
        if (existing && sig === _imgReportSig) return;
        _imgReportSig = sig;

        if (!existing) {
          existing = document.createElement('div');
          existing.id = 'bgs-img-report';
          existing.style.cssText = 'margin:0.75rem 0;padding:0.7rem 0.9rem;border:1px solid rgba(212,175,55,0.15);' +
            'background:rgba(212,175,55,0.03);font-size:0.72rem;line-height:1.6;' +
            "font-family:'Inter','Helvetica Neue',sans-serif;";
          table.parentElement.insertBefore(existing, table);
        }
        existing.innerHTML = html;
      }

      /* ─────────────────────────────────────────
         HIDE ORIGINAL REACT GOLD BOX (polling)
         ───────────────────────────────────────── */
      var reactBoxHidden = false;
      function tryHideReactBox() {
        if (reactBoxHidden) return;
        if (hideReactGoldBox()) reactBoxHidden = true;
      }

      /* ─────────────────────────────────────────
         HIDE REACT 22K ADMIN SECTION (polling)
         ───────────────────────────────────────── */
      function tryHideReact22KAdmin() {
        var headings = document.querySelectorAll('h2,h3,h4');
        for (var i = 0; i < headings.length; i++) {
          var h = headings[i];
          if (h.textContent.trim() === '22K Gold Rate (AED/g)') {
            var container = h.parentElement;
            if (container && window.getComputedStyle(container).display !== 'none') {
              container.style.setProperty('display', 'none', 'important');

            return;
          }

      /* ─────────────────────────────────────────
         MAIN INIT LOOP
         ───────────────────────────────────────── */
      var navInjected = false;
      var footerInjected = false;
      var adminInjected = false;
      var heroAdminInjected = false;
      var marqueeAdminInjected = false;
      var goldBuilt = false;
      // filterInjected is declared in the category filter section above

      var _taglinePatched = false;
      function patchReactText() {
        if (_taglinePatched) return;
        var ps = document.querySelectorAll('p');
        for (var i = 0; i < ps.length; i++) {
          if (ps[i].textContent.indexOf('Beneath this') >= 0) {
            ps[i].textContent = 'Hidden luxury';
            _taglinePatched = true;
            return;
          }
        }
      }

      /* ─────────────────────────────────────────
         SCROLLING RIBBON — pause-on-hover + editable text (synced)
         ───────────────────────────────────────── */
      var DEFAULT_MARQUEE = ['22K Gold', 'Lab Grown Diamonds', 'Handcrafted', 'BGS Jewellery', 'Bespoke Jewellery', 'Hidden Luxury'];

      function getMarqueeItems(customOnly) {
        try {
          var raw = localStorage.getItem('fg_marquee_items');
          if (raw) { var a = JSON.parse(raw); if (Array.isArray(a) && a.length) return a; }
        } catch (e) {}
        return customOnly ? null : DEFAULT_MARQUEE.slice();
      }

      // Pause the ribbon while a pointer hovers or presses it (works on desktop + touch)
      function bgsBindMarqueePause(track) {
        if (!track || track.dataset.bgsMqBound) return;
        track.dataset.bgsMqBound = '1';
        var pause = function () { track.classList.add('bgs-mq-paused'); };
        var run   = function () { track.classList.remove('bgs-mq-paused'); };
        track.addEventListener('mouseenter', pause);
        track.addEventListener('mouseleave', run);
        track.addEventListener('touchstart', pause, { passive: true });
        track.addEventListener('touchend', run);
        track.addEventListener('touchcancel', run);
      }

      // Replace the ribbon words with the admin's custom list (only if customized).
      // Clones the existing spans so the fonts/spacing/animation stay identical.
      function bgsApplyMarquee() {
        var items = getMarqueeItems(true); // custom only — null = leave React default
        if (!items) return;
        var track = document.querySelector('.marquee-track');
        if (!track || !track.children.length) return;
        var sig = items.join('|||');
        if (track.dataset.bgsMqSig === sig) return;
        var wordTpl = null, sepTpl = null, kids = track.children, i, t;
        for (i = 0; i < kids.length; i++) {
          t = (kids[i].textContent || '').trim();
          if (t === '·' && !sepTpl) sepTpl = kids[i];
          else if (t && t !== '·' && !wordTpl) wordTpl = kids[i];
          if (wordTpl && sepTpl) break;
        }
        if (!wordTpl || !sepTpl) return;
        var frag = document.createDocumentFragment();
        function addSet() {
          items.forEach(function (w) {
            var ws = wordTpl.cloneNode(true); ws.textContent = w; frag.appendChild(ws);
            frag.appendChild(sepTpl.cloneNode(true));
          });
        }
        addSet(); addSet(); // duplicated so the seamless -50% loop still lines up
        track.innerHTML = '';
        track.appendChild(frag);
        track.dataset.bgsMqSig = sig;
        bgsBindMarqueePause(track);
      }

      // Admin editor — injected into the settings page next to the other panels
      function injectMarqueePanel() {
        if (document.getElementById('bgs-marquee-panel')) return true;
        var anchor = document.getElementById('bgs-hero-panel') || document.getElementById('bgs-admin-gold-panel');
        if (!anchor || !anchor.parentElement) return false;
        var panel = document.createElement('div');
        panel.id = 'bgs-marquee-panel';
        panel.innerHTML =
          '<p class="bgs-mq-title">Scrolling Ribbon</p>' +
          '<p class="bgs-mq-sub">One phrase per line. These scroll across the ribbon under the hero. The ribbon pauses when a visitor hovers or presses it.</p>' +
          '<textarea id="bgs-mq-text" class="bgs-mq-textarea" rows="6" spellcheck="false"></textarea>' +
          '<div class="bgs-mq-row">' +
            '<button class="bgs-mq-save" onclick="bgsMarqueeSave()">Save Ribbon</button>' +
            '<button class="bgs-mq-reset" onclick="bgsMarqueeReset()">Reset to default</button>' +
          '</div>' +
          '<span id="bgs-mq-tick" class="bgs-mq-tick">&#10003; Saved &amp; synced</span>';
        anchor.parentElement.insertBefore(panel, anchor.nextSibling);
        var ta = document.getElementById('bgs-mq-text');
        if (ta) ta.value = getMarqueeItems(false).join('\n');
        return true;
      }

      function bgsMarqueeFlash(msg) {
        var tk = document.getElementById('bgs-mq-tick');
        if (!tk) return;
        tk.textContent = msg;
        tk.style.display = 'block';
        setTimeout(function () { tk.style.display = 'none'; }, 2200);
      }

      window.bgsMarqueeSave = function () {
        var ta = document.getElementById('bgs-mq-text');
        if (!ta) return;
        var items = ta.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
        if (!items.length) { alert('Add at least one phrase (one per line).'); return; }
        localStorage.setItem('fg_marquee_items', JSON.stringify(items)); // fg_ prefix → syncs to all devices
        var tr = document.querySelector('.marquee-track'); if (tr) delete tr.dataset.bgsMqSig;
        bgsApplyMarquee();
        bgsMarqueeFlash('✓ Saved & synced');
      };

      window.bgsMarqueeReset = function () {
        // Store the defaults (rather than removing) so the reset also syncs across devices
        localStorage.setItem('fg_marquee_items', JSON.stringify(DEFAULT_MARQUEE));
        var ta = document.getElementById('bgs-mq-text'); if (ta) ta.value = DEFAULT_MARQUEE.join('\n');
        var tr = document.querySelector('.marquee-track'); if (tr) delete tr.dataset.bgsMqSig;
        bgsApplyMarquee();
        bgsMarqueeFlash('✓ Reset to default');
      };

      // Re-apply quickly when another device pushes a ribbon change
      window.addEventListener('fg_inventory_updated', bgsApplyMarquee);

      function tick() {
        // Gold ticker — build once React has loaded
        if (!goldBuilt && document.getElementById('root') && document.getElementById('root').children.length > 0) {
          initGold();
          goldBuilt = true;
        }

        // Patch React-rendered text strings
        patchReactText();

        // Always try to hide the React gold box
        tryHideReactBox();

        // Always hide the React 22K admin section (our unified panel replaces it)
        tryHideReact22KAdmin();

        // Image status report on the upload preview
        updateImportImageReport();

        // Custom category filter bar (replaces React's filter buttons on inventory page)
        if (!filterInjected) {
          filterInjected = !!injectCategoryFilter();
        }
        if (filterInjected && !document.getElementById('bgs-cat-filter')) {
          filterInjected = false;
        }
        // Keep React's filter buttons hidden while our UI is active
        if (filterInjected && _bgsFilterContainer && document.contains(_bgsFilterContainer)) {
          _bgsFilterContainer.style.setProperty('display', 'none', 'important');
        }

        // Nav dropdowns
        if (!navInjected) {
          navInjected = !!buildNavDropdowns();
        }

        // Re-check nav injection if React re-rendered and removed our elements.
        // Skipped while the inventory is hidden — there is no element to find,
        // so this would otherwise re-arm the build on every tick forever.
        if (BGS_INVENTORY_VISIBLE && navInjected && !document.getElementById('bgs-collection-nav')) {
          navInjected = false;
        }

        // Keep the CTAs pointing at contact rather than the hidden inventory
        bgsRetargetCTAs();

        // Footer About Us
        if (!footerInjected) {
          footerInjected = injectAboutUsFooter();
        }
        if (footerInjected && !document.getElementById('bgs-about-us-li')) {
          footerInjected = false;
        }

        // Admin panel extension
        if (!adminInjected) {
          adminInjected = injectAdminGoldPanel();
        }
        if (adminInjected && !document.getElementById('bgs-admin-gold-panel')) {
          adminInjected = false;
        }

        // Undo affordance beside the admin's Delete All Stock button
        injectStockUndo();

        // Hero products admin panel
        if (!heroAdminInjected) {
          heroAdminInjected = injectAdminHeroPanel();
        }
        if (heroAdminInjected && !document.getElementById('bgs-hero-panel')) {
          heroAdminInjected = false;
        }

        // Editorial hero collage — also re-hides React's hero on re-render
        bgsBuildEditorialHero();

        // Apply hero products on homepage collection
        applyHeroProducts();

        // Gold rate bar, ruled off the bottom of the collage
        injectHeroRateBar();
        bgsPositionHeroChrome();

        // Scrolling ribbon: bind pause-on-hover/press, apply custom text if set
        var _mqTrack = document.querySelector('.marquee-track');
        if (_mqTrack) bgsBindMarqueePause(_mqTrack);
        bgsApplyMarquee();

        // Ribbon admin editor (settings page)
        if (!marqueeAdminInjected) {
          marqueeAdminInjected = injectMarqueePanel();
        }
        if (marqueeAdminInjected && !document.getElementById('bgs-marquee-panel')) {
          marqueeAdminInjected = false;
        }
      }

      // Run every 600ms — fast enough to catch React re-renders, light enough for production
      setInterval(tick, 600);
      // Also run immediately after DOM loads
      document.addEventListener('DOMContentLoaded', tick);
      // And after hash changes (page navigation)
      window.addEventListener('hashchange', function () {
        navInjected = false;
        filterInjected = false;
        footerInjected = false;
        adminInjected = false;
        heroAdminInjected = false;
        marqueeAdminInjected = false;
        reactBoxHidden = false;
        heroPrevSig = null;
        // Force admin password prompt every time settings page is opened
        try { sessionStorage.removeItem('fg_admin'); } catch(e) {}
        setTimeout(tick, 200);
        setTimeout(tick, 600);
        setTimeout(tick, 1200);
      });

    })();
    </script>
    <!-- PERF: async-decode + lazy-load images. Anything already carrying a
         loading attribute is left alone — the editorial hero tiles set
         loading="eager" for exactly that reason. -->
    <script id="bgs-img-perf">
    (function () {
      function hint(img) {
        if (!img.getAttribute('decoding')) img.setAttribute('decoding', 'async');
        if (!img.getAttribute('loading'))  img.setAttribute('loading', 'lazy');
      }
      function scan(root) {
        if (!root || !root.querySelectorAll) return;
        if (root.tagName === 'IMG') hint(root);
        root.querySelectorAll('img').forEach(hint);
      }
      scan(document);
      new MutationObserver(function (muts) {
        for (var i = 0; i < muts.length; i++) {
          var added = muts[i].addedNodes;
          for (var j = 0; j < added.length; j++) {
            if (added[j].nodeType === 1) scan(added[j]);
          }
        }
      }).observe(document.documentElement, { childList: true, subtree: true });
    })();
    </script>
  </body>
